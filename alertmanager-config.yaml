alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'client_id']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'slack-notifications'
    receivers:
    - name: 'slack-notifications'
      slack_configs:
      - channel: '#aetheris-alerts'
        # Replace with your actual Slack Webhook URL
        api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        send_resolved: true
        text: "*Alert:* {{ .CommonAnnotations.summary }}\n*Details:* {{ .CommonAnnotations.description }}"

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aetheris-api-ingress
  namespace: default
  annotations:
    # Rate Limiting
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2.5"
    
    # External API Key Authentication Gate
    nginx.ingress.kubernetes.io/auth-url: "http://aetheris-auth-service.default.svc.cluster.local/"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aetheris-orchestrator-service
            port:
              number: 8080

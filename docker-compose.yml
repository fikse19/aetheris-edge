services:
  aetheris-sender:
    image: aetheris-sender
    build: .
    pull_policy: build
    container_name: aetheris-sender
    restart: unless-stopped
    command: /app/aetheris-dataplane --target impaired-bridge:8081 --rate 100 --payload-size 1024 --loop
    networks:
      - aetheris-net

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - aetheris-net

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana_provisioning:/etc/grafana/provisioning
    networks:
      - aetheris-net

networks:
  aetheris-net:
    external: true
